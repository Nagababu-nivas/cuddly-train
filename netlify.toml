[build]
  publish = "orange"
  command = ""
  functions = "netlify/functions"

# Full-track streaming endpoint
[[redirects]]
  from = "/api/stream"
  to = "/.netlify/functions/stream"
  status = 200

# JioSaavn API endpoint
[[redirects]]
  from = "/api/saavn"
  to = "/.netlify/functions/saavn"
  status = 200