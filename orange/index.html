<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Orange — a local-first music app for free previews, public radio and your own library.">
  <meta name="theme-color" content="#fa2d48">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23fa2d48'/%3E%3Cpath fill='white' d='M13 5.2v14.1a4.6 4.6 0 1 0 2.2 3.9V9.4l8.1-2.1v9.3a4.6 4.6 0 1 0 2.2 3.9V4.1L13 5.2Z'/%3E%3C/svg%3E">
  <title>Orange — Music</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar" aria-label="Primary navigation">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="24" height="24"><path fill="currentColor" d="M13 5.2v14.1a4.6 4.6 0 1 0 2.2 3.9V9.4l8.1-2.1v9.3a4.6 4.6 0 1 0 2.2 3.9V4.1L13 5.2Z"/></svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">Orange</span>
          <span class="brand-sub">Music, your way</span>
        </div>
      </div>

      <nav id="sidebar-nav" class="sidebar-nav"></nav>

      <div class="sidebar-footer">
        <button class="sidebar-foot-btn" data-modal="settings" title="Settings">
          <span data-icon="settings"></span><span>Settings</span>
        </button>
        <button class="sidebar-foot-btn" data-modal="about" title="About">
          <span data-icon="info"></span><span>About</span>
        </button>
      </div>
    </aside>

    <div id="main-shell">
      <header id="topbar">
        <div class="history-buttons">
          <button class="icon-btn" id="back-btn" title="Back" aria-label="Back" disabled><span data-icon="chevron-left"></span></button>
          <button class="icon-btn" id="forward-btn" title="Forward" aria-label="Forward" disabled><span data-icon="chevron-right"></span></button>
        </div>

        <div class="topbar-title-wrap">
          <div id="topbar-eyebrow" class="topbar-eyebrow">Listen Now</div>
          <h1 id="topbar-title">Made for you</h1>
        </div>

        <div class="topbar-actions">
          <label id="search-wrap" class="search-wrap" for="search-input">
            <span data-icon="search"></span>
            <input id="search-input" type="search" placeholder="Artists, songs, albums" autocomplete="off" spellcheck="false">
            <button id="search-clear" class="search-clear hidden" title="Clear search" aria-label="Clear search"><span data-icon="close"></span></button>
          </label>
          <button id="add-music-btn" class="pill-btn" title="Add music">
            <span data-icon="plus"></span><span class="pill-label">Add Music</span>
          </button>
          <button id="right-panel-btn" class="icon-btn" title="Playing Next" aria-label="Playing Next"><span data-icon="queue"></span></button>
          <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings"><span data-icon="settings"></span></button>
        </div>
      </header>

      <main id="main" tabindex="-1"></main>
    </div>
  </div>

  <aside id="right-panel" class="right-panel" aria-label="Now playing details">
    <div class="right-panel-head">
      <div class="segmented" id="right-tabs">
        <button data-right-tab="queue" class="active">Up Next</button>
        <button data-right-tab="lyrics">Lyrics</button>
      </div>
      <button class="icon-btn" id="right-close" title="Close panel" aria-label="Close panel"><span data-icon="close"></span></button>
    </div>
    <div id="right-panel-body" class="right-panel-body"></div>
  </aside>

  <footer id="player" class="player" aria-label="Player">
    <div class="player-left">
      <button id="player-art" class="player-art placeholder" title="Open full player" aria-label="Open full player">
        <span class="player-art-fallback" data-icon="music"></span>
      </button>
      <div class="player-meta">
        <button id="player-title" class="player-title">Nothing playing</button>
        <button id="player-artist" class="player-artist">Choose a song to begin</button>
      </div>
      <button id="player-like" class="icon-btn like-btn" title="Love" aria-label="Love"><span data-icon="heart"></span></button>
      <button id="download-btn" class="icon-btn download-btn" title="Download" aria-label="Download"><span data-icon="download"></span></button>
    </div>

    <div class="player-center">
      <div class="transport">
        <button id="shuffle-btn" class="icon-btn" title="Shuffle" aria-label="Shuffle"><span data-icon="shuffle"></span></button>
        <button id="prev-btn" class="icon-btn" title="Previous" aria-label="Previous"><span data-icon="prev"></span></button>
        <button id="play-btn" class="play-btn" title="Play" aria-label="Play"><span data-icon="play"></span></button>
        <button id="next-btn" class="icon-btn" title="Next" aria-label="Next"><span data-icon="next"></span></button>
        <button id="repeat-btn" class="icon-btn" title="Repeat" aria-label="Repeat"><span data-icon="repeat"></span></button>
      </div>
      <div class="scrubber-row">
        <span id="time-current" class="time">0:00</span>
        <div id="scrubber" class="scrubber" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
          <div class="scrubber-track"><div id="scrubber-fill" class="scrubber-fill"></div><div id="scrubber-thumb" class="scrubber-thumb"></div></div>
        </div>
        <span id="time-total" class="time">0:00</span>
      </div>
    </div>

    <div class="player-right">
      <button id="lyrics-btn" class="icon-btn" title="Lyrics" aria-label="Lyrics"><span data-icon="lyrics"></span></button>
      <button id="queue-btn" class="icon-btn" title="Up Next" aria-label="Up Next"><span data-icon="queue"></span></button>
      <button id="eq-btn" class="icon-btn" title="Equalizer" aria-label="Equalizer"><span data-icon="sliders"></span></button>
      <div class="volume-wrap">
        <button id="mute-btn" class="icon-btn" title="Mute" aria-label="Mute"><span data-icon="volume"></span></button>
        <div id="volume" class="volume" role="slider" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80" tabindex="0">
          <div class="volume-track"><div id="volume-fill" class="volume-fill"></div></div>
        </div>
      </div>
    </div>
  </footer>

  <div id="now-playing-root"></div>
  <div id="modal-root"></div>
  <div id="menu-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <audio id="audio-local" preload="metadata"></audio>
  <audio id="audio-remote" preload="metadata"></audio>

  <script type="module" src="js/app.js?v=orange3"></script>
</body>
</html>
